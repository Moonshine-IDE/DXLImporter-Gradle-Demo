plugins {
    // Apply the java-library plugin to add support for Java Library
    id 'java-library'
    // Apply the groovy plugin to also add support for Groovy (needed for Spock)
    id 'groovy'
    id 'eclipse'      // allows dependencies to be exported to SVN
    
}

// Without archivesBaseName, the default JAR will match the parent directory, which can break the agentProperties configuration
archivesBaseName='Submodule-Name'

repositories {
    // Use jcenter for resolving your dependencies.
    // You can declare any Maven/Ivy/file repository here.
    jcenter()
}

dependencies {
    // DXL Importer dependencie are included from ../build.gradle

    // Domino Dependencies based on code in ../build.gradle
    implementation files("$notesJarPath")
    // add other Notes dependencies like this:
    implementation files(findFile(notesJarBaseDir, 'websvc.jar'))


    // Local Project dependencies
    //implementation project(':Other-Submodule')

    // add submodule dependencies here
    

}

sourceSets {
    main {
        java {
            srcDirs = ['src', 'test']
        }
    }
}

// fat jar
jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE


    // Include additional files or directories in the JAR if needed
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
    exclude 'META-INF/*.RSA', 'META-INF/*.SF', 'META-INF/*.DSA'
}


// Include these lines to generate DXLImporter tasks (i.e. import<AgentName>)
task importAllScriptLibraries() {
	// placeholder for dependencies generated by below code
}

task importAllAgents(dependsOn:  tasks.getByName('importAllScriptLibraries')) {
	// placeholder for dependencies generated by below code
	// Used to enforce that importAllScriptLibraries runs before the agents, without requring the script libraries for each agent.
}

task importAll(dependsOn: [tasks.getByName('importAllScriptLibraries'), tasks.getByName('importAllAgents')]) {
	// further dependencies should be added to importAllScriptLibraries or importAllAgents
}

initializeImporterTasks(projectDir)


